# 实验 2B：Claude 审查。只读 diff（不检出、不运行候选代码），Claude 不给任何工具。
# v0.6：review 只给结论；sign 核对账本和 issue 当前内容后，用签发 App 写 harness/review。
# 审查记忆：memory 从账本取批准快照和最近的审查记录；review 再拼上 main 的项目记忆、清单和代码；sign 把这次审查写回账本。
name: review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  LEDGER_REPO: yiyiii-hz/harness-ledger-test
  HISTORY_N: "10"

jobs:
  memory:
    # 只读账本，不碰候选代码；账本 App 私钥只用来换一个只读令牌
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: signer
    permissions: {}
    timeout-minutes: 5
    outputs:
      task: ${{ steps.m.outputs.task }}
      history: ${{ steps.m.outputs.history }}
    steps:
      - name: Read approved task snapshot and review history
        id: m
        env:
          LEDGER_APP_ID: ${{ secrets.LEDGER_APP_ID }}
          LEDGER_APP_KEY: ${{ secrets.LEDGER_APP_KEY }}
          REPO_ID: ${{ github.repository_id }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$LEDGER_APP_ID" | b64)
          jwt="$h.$p.$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign <(printf '%s\n' "$LEDGER_APP_KEY") | b64)"
          inst=$(curl -fsS --retry 3 -H "Authorization: Bearer $jwt" "https://api.github.com/repos/$LEDGER_REPO/installation" | jq -r .id)
          LT=$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $jwt" "https://api.github.com/app/installations/$inst/access_tokens" \
                 -d "$(jq -nc --arg r "${LEDGER_REPO#*/}" '{repositories:[$r],permissions:{contents:"read"}}')" | jq -r .token)
          echo "::add-mask::$LT"
          L() { curl -sS --retry 3 -H "Authorization: Bearer $LT" "$@"; }
          RAW="Accept: application/vnd.github.raw+json"

          # 任务快照：dispatch_id 取 PR 正文第一行，且分支名必须对得上；否则当作非派活 PR
          id=$(jq -rn --arg b "$PR_BODY" '$b | (split("\n")[0] // "") | capture("^dispatch_id: (?<id>[0-9]+-g[0-9]+)$").id // ""')
          task='{}'
          if [ -n "$id" ] && [ "$BRANCH" = "grok/$id" ]; then
            task=$(L -H "$RAW" "https://api.github.com/repos/$LEDGER_REPO/contents/dispatch/$id.json" \
                   | jq -c 'if .dispatch_id then {dispatch_id, title, body} else {} end' || echo '{}')
          fi

          # 最近的审查记录：文件名 <run_id>-<attempt>-pr<n>.json，按运行号排序取最后 N 条
          names=$(L "https://api.github.com/repos/$LEDGER_REPO/contents/reviews/$REPO_ID" \
                  | jq -r 'if type == "array" then .[].name else empty end' | sort -t- -k1,1n -k2,2n | tail -n "$HISTORY_N")
          history=$(for n in $names; do
                      L -H "$RAW" "https://api.github.com/repos/$LEDGER_REPO/contents/reviews/$REPO_ID/$n" \
                        | jq -c '{pr, head: .head[0:7], verdict, injection_detected, reasons: [(.reasons // [])[] | .[0:600]], missing_context}' || true
                    done | jq -sc .)
          echo "task: $(jq -r '.dispatch_id // "none"' <<<"$task"), history items: $(jq length <<<"$history")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "history=$history" >> "$GITHUB_OUTPUT"

  review:
    # W17：来自 fork 的 PR 不审查
    needs: memory
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: reviewer
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.record.outputs.verdict }}
      sha: ${{ steps.record.outputs.sha }}
      record: ${{ steps.record.outputs.record }}
    steps:
      - name: Fetch diff and main (data only, candidate never checked out)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TASK: ${{ needs.memory.outputs.task }}
          HISTORY: ${{ needs.memory.outputs.history }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/review"; mkdir -p "$D/base"; cd "$D"
          gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/pulls/$PR" > pr.diff
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > changed.tsv
          echo "$HEAD_SHA" > sha
          # memory 失败时为空：提示词里任务显示为 none、历史为空，sign 另外会因 memory 失败而拒签
          printf '%s' "$TASK" > task.json
          printf '%s' "$HISTORY" > history.json
          # 只取 base 的文件（git archive，不检出、不跑钩子）
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q repo
          git -C repo -c http.extraHeader="$auth" fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$BASE_SHA"
          git -C repo archive FETCH_HEAD | tar -x -C base
          wc -c pr.diff; cat changed.tsv

      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.304

      - name: Review with all tools disabled
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          D="$RUNNER_TEMP/review"
          size=$(wc -c < "$D/pr.diff")
          if [ "$size" -gt 200000 ]; then
            echo '{"structured_output":{"verdict":"fail","reasons":["diff too large"]}}' > "$D/out.json"; exit 0
          fi
          # 拼提示词的脚本取自 base（.harness/ 受保护），候选改不了
          python3 -I "$D/base/.harness/build_review_prompt.py" "$D/base" "$D/changed.tsv" "$D/pr.diff" \
            "$D/task.json" "$D/history.json" "$D/prompt.txt" "$D/meta.json" | tee -a "$GITHUB_STEP_SUMMARY" \
            || { echo '{"structured_output":{"verdict":"fail","reasons":["prompt build failed"]}}' > "$D/out.json"; exit 0; }
          SCHEMA='{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"reasons":{"type":"array","items":{"type":"string"}},"injection_detected":{"type":"boolean"},"missing_context":{"type":"array","items":{"type":"string"}}},"required":["verdict","reasons","injection_detected","missing_context"],"additionalProperties":false}'
          W=$(mktemp -d)
          cd "$W"
          # 只传必需的变量：GITHUB_TOKEN、ACTIONS_RUNTIME_TOKEN 等都不进入 Claude 的进程
          env -i HOME="$W" PATH="$PATH" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            claude -p --tools "" --strict-mcp-config --disable-slash-commands --no-session-persistence \
              --model sonnet --output-format json --json-schema "$SCHEMA" \
            < "$D/prompt.txt" > "$D/out.json" || echo '{"structured_output":null,"is_error":true}' > "$D/out.json"

      - name: Record verdict
        id: record
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - "$RUNNER_TEMP/review" "$(cat "$RUNNER_TEMP/review/sha")" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import base64, json, os, sys
          D, sha = sys.argv[1], sys.argv[2]
          d = json.load(open(f"{D}/out.json"))
          try:
              meta = json.load(open(f"{D}/meta.json"))
          except (OSError, ValueError):
              meta = {}
          so = d.get("structured_output") or {}
          # 只有结构化结论里明确的 pass 才算通过；其余一律 fail
          verdict = "pass" if so.get("verdict") == "pass" and not d.get("is_error") else "fail"
          u = d.get("usage") or {}
          # 写回账本的审查记录（sign 负责写入）；下次审查时作为 review_history
          record = {"pr": int(os.environ["PR"]), "head": sha, "base": os.environ["BASE_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "verdict": verdict, "injection_detected": so.get("injection_detected"),
                    "reasons": so.get("reasons", []), "missing_context": so.get("missing_context", []),
                    "context": meta, "model": "sonnet", "cost_usd": d.get("total_cost_usd"),
                    "usage": {k: u.get(k) for k in ("input_tokens", "cache_creation_input_tokens", "cache_read_input_tokens", "output_tokens")}}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"verdict={verdict}\nsha={sha}\n")
              f.write("record=" + base64.b64encode(json.dumps(record, ensure_ascii=False).encode()).decode() + "\n")
          print(f"### review for {sha[:7]}: **{verdict}**")
          print(f"- injection_detected: {so.get('injection_detected')}")
          print(f"- context: {json.dumps(meta)}")
          for r in so.get("reasons", []):
              print(f"- {r}")
          for m in so.get("missing_context", []):
              print(f"- missing: {m}")
          print(f"- cost_usd: {d.get('total_cost_usd')} turns: {d.get('num_turns')} "
                f"input: {u.get('input_tokens')} cache_create: {u.get('cache_creation_input_tokens')} "
                f"cache_read: {u.get('cache_read_input_tokens')} output: {u.get('output_tokens')}")
          EOF

  ci:
    # v0.6 §6.1：预检 → 只按 base 的依赖文件装依赖 → 候选只在断网、无环境变量、非 root 的容器里跑 base 的测试
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      exit: ${{ steps.test.outputs.exit }}
      sha: ${{ steps.test.outputs.sha }}
      deps_digest: ${{ steps.deps.outputs.digest }}
    env:
      # 实时从 Docker Hub 查到的 digest（2026-10-20），固定镜像，防止被替换
      IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Fetch base and candidate (files only, no code executed)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          W="$RUNNER_TEMP/ci"; mkdir -p "$W"; cd "$W"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q repo && cd repo
          git -c http.extraHeader="$auth" fetch -q --depth 50 "https://github.com/$GITHUB_REPOSITORY" "$BASE_SHA" "pull/$PR/head"
          git worktree add -q --detach ../base "$BASE_SHA"
          git worktree add -q --detach ../cand "$HEAD_SHA"
          git diff --name-status --no-renames "$BASE_SHA...$HEAD_SHA" > ../changed.txt
          echo "changed files:"; sed 's/^/  /' ../changed.txt

      - name: Precheck (W04, W22)
        id: pre
        run: |
          cd "$RUNNER_TEMP/ci"
          protected='^(\.github/|\.harness/)|(^|/)(requirements[^/]*\.txt|pyproject\.toml|setup\.(py|cfg)|Pipfile(\.lock)?|poetry\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.npmrc|pip\.conf|\.pypirc|sitecustomize\.py|usercustomize\.py)$'
          bad=""; : > new_tests.txt
          while IFS=$'\t' read -r st path; do
            if [[ "$path" =~ $protected ]]; then bad+="$st $path"$'\n'; continue; fi
            if [[ "$path" == tests/* ]]; then
              # 已有测试不许改、不许删；只允许新增 tests/test_*.py
              if [ "$st" = A ] && [[ "$path" =~ ^tests/test_[A-Za-z0-9_]+\.py$ ]]; then echo "$path" >> new_tests.txt
              else bad+="$st $path"$'\n'; fi
            fi
          done < changed.txt
          if [ -n "$bad" ]; then
            echo "precheck failed, candidate touched protected files:"; printf '%s' "$bad" | sed 's/^/  /'
            { echo "### precheck failed"; printf '%s' "$bad" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # 新增的测试单独放一份（第二次运行用）；候选树里的 tests/ 换成 base 的
          mkdir -p newtests
          while read -r f; do cp "cand/$f" newtests/; done < new_tests.txt
          echo "new tests: $(wc -l < new_tests.txt)"; sed 's/^/  /' new_tests.txt
          rm -rf cand/tests && cp -r base/tests cand/tests

      - name: Install deps from base only
        id: deps
        run: |
          cd "$RUNNER_TEMP/ci"
          mkdir -p deps && chmod 777 deps
          echo "digest=$(sha256sum base/requirements.txt | cut -c1-64)" >> "$GITHUB_OUTPUT"
          # 不挂载候选代码；不传任何环境变量；只读挂载 base 的 requirements.txt
          docker run --rm --user 65534:65534 -e HOME=/tmp -e PIP_NO_CACHE_DIR=1 \
            -v "$PWD/base/requirements.txt:/req.txt:ro" -v "$PWD/deps:/deps" "$IMAGE" \
            python -m pip install --quiet --disable-pip-version-check --no-compile --target /deps -r /req.txt
          # 不需要 chmod：依赖目录由 nobody 写入，测试时以 :ro 只读挂载

      - name: Run tests (offline, no env, non-root, trusted runner)
        id: test
        run: |
          cd "$RUNNER_TEMP/ci"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          # $1=代码目录 $2=测试目录 $3=输出文件；运行脚本来自 base，只读挂载
          run() {
            docker run --rm --network none --user 65534:65534 --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g \
              -e PYTHONPATH=/deps -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp \
              -v "$PWD/$1:/w:ro" -v "$PWD/$2:/t:ro" -v "$PWD/deps:/deps:ro" -v "$PWD/base/.harness:/runner:ro" \
              -w /tmp "$IMAGE" timeout 300 python -P /runner/run_tests.py /w /t > "$3" 2>&1
          }
          # 结果行必须是最后一行，并且由运行脚本打印；只看退出码会被 os._exit(0) 骗过
          parse() { tail -n 1 "$1" | sed -nE 's/^HARNESS-RESULT ran=([0-9]+) failures=([0-9]+) errors=([0-9]+) skipped=([0-9]+)$/\1 \2 \3 \4/p'; }
          set +e
          run base base/tests baseline.txt; read -r n_base _ <<<"$(parse baseline.txt)"
          run cand cand/tests run1.txt; code1=$?; read -r ran1 f1 e1 s1 <<<"$(parse run1.txt)"
          code2=0; ran2=0; f2=0; e2=0; s2=0
          if [ -s new_tests.txt ]; then run cand newtests run2.txt; code2=$?; read -r ran2 f2 e2 s2 <<<"$(parse run2.txt)"; fi
          set -e
          echo "--- run1: candidate code + base tests"; head -c 15000 run1.txt
          [ -f run2.txt ] && { echo "--- run2: candidate code + new tests only"; head -c 15000 run2.txt; }
          ok=1
          [ -n "$n_base" ] && [ "$n_base" -gt 0 ] || { echo "baseline produced no result line"; ok=0; }
          [ "$code1" = 0 ] && [ "${ran1:-x}" = "$n_base" ] && [ "$f1$e1$s1" = 000 ] || { echo "run1 failed: exit=$code1 ran=${ran1:-none}/${n_base:-?} f=$f1 e=$e1 s=$s1"; ok=0; }
          if [ -s new_tests.txt ]; then
            [ "$code2" = 0 ] && [ "${ran2:-0}" -gt 0 ] && [ "$f2$e2$s2" = 000 ] || { echo "run2 failed: exit=$code2 ran=${ran2:-none} f=$f2 e=$e2 s=$s2"; ok=0; }
          fi
          exit_code=$([ $ok = 1 ] && echo 0 || echo 1)
          echo "exit=$exit_code" >> "$GITHUB_OUTPUT"
          echo "### trusted-ci exit=$exit_code (base tests ${ran1:-?}/${n_base:-?}, new tests ${ran2})" | tee -a "$GITHUB_STEP_SUMMARY"

  sign:
    needs: [memory, review, ci]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: signer
    permissions:
      pull-requests: read
      issues: read
    timeout-minutes: 5
    steps:
      - name: Verify ledger and sign
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_APP_ID: ${{ secrets.SIGNER_APP_ID }}
          SIGNER_APP_KEY: ${{ secrets.SIGNER_APP_KEY }}
          LEDGER_APP_ID: ${{ secrets.LEDGER_APP_ID }}
          LEDGER_APP_KEY: ${{ secrets.LEDGER_APP_KEY }}
          MEMORY_RESULT: ${{ needs.memory.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_RECORD: ${{ needs.review.outputs.record }}
          CI_RESULT: ${{ needs.ci.result }}
          CI_EXIT: ${{ needs.ci.outputs.exit }}
          CI_SHA: ${{ needs.ci.outputs.sha }}
          DEPS_DIGEST: ${{ needs.ci.outputs.deps_digest }}
          OWNER: yiyiii-hz
          VERDICT: ${{ needs.review.outputs.verdict }}
          REVIEWED_SHA: ${{ needs.review.outputs.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO_ID: ${{ github.repository_id }}
          GROK_BOT: grok-executor-test[bot]
        run: |
          set -euo pipefail
          app_token() { # $1=APP_ID $2=APP_KEY $3=repo
            b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            local now h p jwt inst
            now=$(date +%s)
            h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
            p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$1" | b64)
            jwt="$h.$p.$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign <(printf '%s\n' "$2") | b64)"
            inst=$(curl -fsS --retry 3 -H "Authorization: Bearer $jwt" "https://api.github.com/repos/$3/installation" | jq -r .id)
            curl -fsS --retry 3 -X POST -H "Authorization: Bearer $jwt" "https://api.github.com/app/installations/$inst/access_tokens" | jq -r .token
          }
          LT=$(app_token "$LEDGER_APP_ID" "$LEDGER_APP_KEY" "$LEDGER_REPO"); echo "::add-mask::$LT"
          ST=$(app_token "$SIGNER_APP_ID" "$SIGNER_APP_KEY" "$GITHUB_REPOSITORY"); echo "::add-mask::$ST"
          L() { curl -sS --retry 3 -H "Authorization: Bearer $LT" -H "Accept: application/vnd.github+json" "$@"; }

          # 先把这次审查写进账本（所有 PR 都写，含用户本人的），供以后的审查当作 review_history
          if [ -n "$REVIEW_RECORD" ]; then
            L -o /dev/null -w 'ledger review record: HTTP %{http_code}\n' -X PUT \
              "https://api.github.com/repos/$LEDGER_REPO/contents/reviews/$REPO_ID/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-pr$PR.json" \
              -d "$(jq -n --arg m "review pr$PR" --arg c "$REVIEW_RECORD" '{message:$m,content:$c}')"
          fi

          # 收集事实；判断全部在下面的 python 里做，任何异常都算 failure
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          # 用户本人的 PR（改工作流等）不走派活流程：这里不写任何检查，由用户在电脑上另行处理
          if [ "$(jq -r .user.login <<<"$pr")" = "$OWNER" ]; then echo "owner PR: not signed by workflow" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          head=$(jq -r .head.sha <<<"$pr"); branch=$(jq -r .head.ref <<<"$pr")
          id=$(jq -r '.body // "" | (split("\n")[0] // "") | capture("^dispatch_id: (?<id>[0-9]+-g[0-9]+)$").id // ""' <<<"$pr")
          num=${id%%-g*}
          receipt='{}'; claims='[]'; revoked=404; issue='{}'
          if [ -n "$id" ]; then
            receipt=$(L -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$LEDGER_REPO/contents/dispatch/$id.json" || echo '{}')
            claims=$(L "https://api.github.com/repos/$LEDGER_REPO/git/matching-refs/claims/$REPO_ID/$num/" || echo '[]')
            d=$(jq -r '.digest // "x"' <<<"$receipt")
            revoked=$(L -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$LEDGER_REPO/contents/revoke/$REPO_ID-$num-${d:0:12}.json")
            issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" || echo '{}')
          fi

          export PR_JSON="$pr" RECEIPT="$receipt" CLAIMS="$claims" REVOKED="$revoked" ISSUE="$issue" ID="$id" BRANCH="$branch" HEAD="$head"
          python3 > /tmp/decision.json <<'EOF'
          import hashlib, json, os
          e = os.environ
          pr, rc, claims, issue = (json.loads(e[k]) for k in ("PR_JSON", "RECEIPT", "CLAIMS", "ISSUE"))
          problems = []
          def need(cond, msg):
              if not cond: problems.append(msg)
          need(e["MEMORY_RESULT"] == "success", f"memory job result={e['MEMORY_RESULT']}")
          need(e["REVIEW_RESULT"] == "success", f"review job result={e['REVIEW_RESULT']}")
          need(e["VERDICT"] == "pass", f"claude verdict={e['VERDICT'] or 'none'}")
          need(e["CI_RESULT"] == "success", f"ci job result={e['CI_RESULT']}")
          need(e["CI_EXIT"] == "0", f"tests exit={e['CI_EXIT'] or 'none'}")
          need(e["CI_SHA"] == e["HEAD"], "tested sha != current head (superseded)")
          need(e["REVIEWED_SHA"] == e["HEAD"], "reviewed sha != current head (superseded)")
          need(pr.get("user", {}).get("login") == e["GROK_BOT"], "PR not opened by the Grok App")
          need(bool(e["ID"]), "no dispatch_id on first line of PR body")
          need(e["BRANCH"] == f"grok/{e['ID']}", "branch name does not match dispatch_id")
          need(rc.get("dispatch_id") == e["ID"], "no ledger receipt for dispatch_id")
          gen = int(e["ID"].split("-g")[1]) if "-g" in e["ID"] else -1
          need(len(claims) == gen, f"generation g{gen} is not the latest (claims={len(claims)})")
          need(any(c.get("ref") == rc.get("claim_ref") for c in claims), "claim ref missing in ledger")
          need(e["REVOKED"] == "404", f"approval revoked in ledger (HTTP {e['REVOKED']})")
          need(issue.get("state") == "open", "issue not open")
          need("approved" in [l["name"] for l in issue.get("labels", [])], "approved label missing")
          cur = hashlib.sha256(f"{issue.get('node_id')}\n{issue.get('title')}\n{issue.get('body') or ''}".encode()).hexdigest()
          need(cur == rc.get("digest"), "issue content changed since approval (digest mismatch)")
          # 只写 success / failure：neutral、skipped 会被 GitHub 当作通过（实测 2A）
          conclusion = "success" if not problems else "failure"
          assert conclusion in ("success", "failure")
          key = {"repo_id": e["REPO_ID"], "pr": e["PR"], "head": e["HEAD"], "base": pr["base"]["sha"],
                 "dispatch_id": e["ID"], "digest": rc.get("digest"), "workflow_sha": e["GITHUB_WORKFLOW_SHA"],
                 "run_id": e["GITHUB_RUN_ID"], "claude_cli": "2.1.304", "model": "sonnet",
                 "deps_digest": e["DEPS_DIGEST"], "image": "python:3.12-slim@sha256:a6e34c59"}
          print(json.dumps({"conclusion": conclusion, "problems": problems, "key": key}))
          EOF
          conclusion=$(jq -r .conclusion /tmp/decision.json)
          summary=$(jq -r '"key: \(.key|tojson)\n\nproblems:\n" + ((.problems|map("- "+.)|join("\n")) // "")' /tmp/decision.json)
          jq . /tmp/decision.json | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS --retry 3 -X POST -H "Authorization: Bearer $ST" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
            -d "$(jq -n --arg sha "$head" --arg c "$conclusion" --arg s "$summary" \
                  '{name:"harness/review",head_sha:$sha,status:"completed",conclusion:$c,output:{title:("harness "+$c),summary:$s}}')" \
            | jq -r '"signed \(.conclusion) on \(.head_sha[0:7]) by app \(.app.id)"'
          if [ -n "$id" ]; then
            L -o /dev/null -w 'ledger sign receipt: HTTP %{http_code}\n' -X PUT \
              "https://api.github.com/repos/$LEDGER_REPO/contents/sign/$id-${head:0:7}-$GITHUB_RUN_ID.json" \
              -d "$(jq -n --arg m "sign $id" --arg c "$(base64 -w0 /tmp/decision.json)" '{message:$m,content:$c}')"
          fi
